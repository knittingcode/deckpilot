# Full installer packaging with the release configuration: Linux .deb,
# AppImage and .rpm, Windows NSIS and MSI, the macOS .app, its updater
# archive and the disk image, their updater artifacts signed with a
# throwaway key, and the assertions of tools/ci/check-packages.sh (names,
# versions, layout, app, bundled agent, udev rule, the distribution record
# and package format compiled or patched into each package's application,
# the plugin runtime, updater signatures). Built in the distribution
# channel `github`, as the release builds are. Nothing is code-signed or
# published; no repository secret or variable is used.
#
# The plugin Marketplace, as in the release builds: the plugin host and the
# bundled first-party plugins (tools/ci/stage-plugin-runtime.sh), the agent
# with the `plugins` feature and their pins compiled in, the frontend with
# VITE_DECKPILOT_PLUGINS=1, and tauri.plugins.conf.json (on macOS also
# tauri.plugins.macos.conf.json; the host signed ad hoc with its
# entitlement, then the entitlement policy checked on the bundle). The one
# difference: no registry root keys are compiled in. The release embeds
# vars.DECKPILOT_REGISTRY_ROOT_PUBKEYS (and refuses to build without it);
# these builds never read a production variable, so their agent uses no
# registry. The roots' embedding is tested by the registry crate
# (crates/deckpilot-plugin-registry/tests/embedded_roots.rs).
#
# The upgrade from the latest published release (the baseline in
# tools/release-pipeline/compat-baseline): its .deb and AppImage,
# downloaded and checked against SHA256SUMS and their updater signatures,
# installed and run on an isolated profile with a fixture configuration,
# then upgraded to this commit's packages; the data must survive with
# this commit's schema and a backup, the new agent must answer at this
# commit's protocol, and the release's agent must refuse the upgraded data
# (tools/ci/check-upgrade.sh, jobs upgrade-tools and upgrade-linux).
#
# Runs:
# - on pull requests, only when packaging-relevant paths change
#   (tools/ci/changed-paths.sh, group `packaging`); otherwise the jobs
#   report as skipped. Pull requests that change the storage and its
#   migrations or the updater (group `upgrade`) build the Linux packages
#   and run the upgrade (and the Linux install checks) only;
# - on pushes to main that change those paths, nightly, by hand
#   (workflow_dispatch), and when called by another workflow (workflow_call):
#   the release workflow calls it before drafting a release, so version tags
#   do not trigger it directly.
#
# Reusable: `uses: ./.github/workflows/packaging.yml`.
#   Inputs (both optional; derived from the version when not given):
#   - prerelease (boolean): a pre-release version (X.Y.Z-alpha.N etc.); no
#     .rpm is built or expected, as RPM does not allow "-" in versions;
#   - msi-version (string): the numeric version for the MSI (WiX accepts
#     only numbers), passed as bundle.windows.wix.version; see
#     tools/ci/msi-version.sh for the mapping.
#   Output `version`: the version whose packages were built and checked.
name: Packaging

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - apps/agent/**
      - packaging/**
      - plugins/first-party/**
      - plugins/runtime/**
      - crates/deckpilot-plugin-bundled/**
      - tools/release-pipeline/check-bundled-plugins.sh
      - tools/ci/**
      - .github/scripts/verify-macos-app.sh
      - .github/workflows/packaging.yml
      - Cargo.lock
      - Cargo.toml
      - apps/desktop/package.json
  schedule:
    # Nightly, 03:17 UTC (off the hour, when runners are less busy).
    - cron: "17 3 * * *"
  # A merge queue group (gh-readonly-queue/main/...): the Changed paths job
  # diffs the group against its base, so the packages are built only when
  # the group changes packaging paths. Inert until the merge queue is on.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release version (no .rpm); derived from the version when unset
        type: boolean
        default: false
      msi-version:
        description: Numeric MSI version (WiX); derived from the version when empty
        type: string
        default: ""
  workflow_call:
    inputs:
      prerelease:
        description: Pre-release version (no .rpm); derived from the version when false
        type: boolean
        default: false
      msi-version:
        description: Numeric MSI version (bundle.windows.wix.version); derived from the version when empty
        type: string
        default: ""
    outputs:
      version:
        description: The version whose packages were built and checked
        value: ${{ jobs.package-linux.outputs.version }}

permissions:
  contents: read

# Pull requests: a new push cancels the obsolete run. Every other run (main,
# nightly, manual, called) has a group of its own and runs to the end.
# (In a called workflow, github.workflow and github.run_id are the caller's.)
concurrency:
  group: packaging-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Empty for events without inputs (pull requests, pushes, nightly).
  PRERELEASE_INPUT: ${{ inputs.prerelease && 'true' || 'false' }}
  MSI_VERSION_INPUT: ${{ inputs.msi-version }}
  # Not named RUST_*: Swatinem/rust-cache hashes every RUST*, CARGO*, CC*,
  # CFLAGS*, CXX* and CMAKE* variable into its cache key, so a variable that
  # differs between main and pull requests gave them different keys and no
  # pull request ever restored main's cache.
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # The distribution record compiled into the app and the agent
  # (crates/deckpilot-distribution), as in the release builds; the package
  # checks read it back from every package.
  DECKPILOT_DISTRIBUTION_CHANNEL: github

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.paths.outputs.packaging }}
      upgrade: ${{ steps.paths.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Merge groups: diff against the group's base commit.
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: tools/ci/changed-paths.sh

  # Builds the Linux .deb, AppImage and .rpm with the release configuration
  # (bundled agent, udev rule) and their updater artifacts, signed with a
  # throwaway key, to catch packaging mistakes before a release. Nothing is
  # published.
  package-linux:
    name: Package check (Linux .deb, AppImage)
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: WebAssembly target (bundled plugins)
        run: rustup target add wasm32-unknown-unknown
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-linux
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway updater key (not the release key)
        run: tools/ci/throwaway-updater-key.sh
      # The plugin host and the bundled first-party plugins; exports
      # DECKPILOT_BUNDLED_PINS for the agent build.
      - name: Build and stage the plugin runtime
        run: |
          tools/ci/stage-plugin-runtime.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and stage the agent (plugins, bundled pins)
        run: |
          test -n "$DECKPILOT_BUNDLED_PINS"
          cargo build --release --locked -p deckpilot-agent --features plugins
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p')"
          tools/release-pipeline/check-bundled-plugins.sh target/bundled-plugins/bundled target/release/deckpilot-agent
      # A pre-release version (input, or a "-" in the version) builds no
      # .rpm: RPM does not allow "-" in versions. The AppImage is always
      # built, as in the release.
      - name: Pre-release or final version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          prerelease="$PRERELEASE_INPUT"
          case "$version" in *-*) prerelease=true ;; esac
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "version $version, pre-release: $prerelease"
      - name: Build the .deb and AppImage (and .rpm for final versions)
        env:
          VITE_DECKPILOT_PLUGINS: "1"
        run: >
          pnpm --filter @deckpilot/desktop tauri build
          --bundles "$([ "$PRERELEASE" = true ] && echo deb,appimage || echo deb,appimage,rpm)"
          --config src-tauri/tauri.release.conf.json
          --config src-tauri/tauri.plugins.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
      - name: Names, versions, layout, plugin runtime, distribution record and updater signatures
        run: tools/ci/check-packages.sh linux
      - name: Checked version
        id: version
        run: echo "version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      # For the installation check on clean systems (install-linux).
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3

  # The packages built above, installed on clean systems with only the
  # dependencies they declare, and their agent started (under Xvfb, with an
  # isolated profile): the .deb with apt on a fresh Ubuntu 24.04 runner
  # (then reinstalled, removed and purged there and in a container), the
  # .rpm with dnf in a Fedora container (then reinstalled and removed). Each
  # removal must take the udev rule and every file of the package, run its
  # postrm without error (and reload udev where udev runs), and leave a
  # user's DeckPilot files in the home directory as they were. Then the
  # AppImage's agent with and without the system's own tray library, and
  # the agent on a system without any (it must keep running without a tray
  # icon). The agent's
  # tray loads libayatana-appindicator3 at run time; 0.7.0's packages did
  # not declare it, its AppImage did not bundle it, and the agent could not
  # start without it (tools/ci/check-linux-install.sh).
  install-linux:
    name: Package install (Linux .deb and AppImage on Ubuntu 24.04, .rpm on Fedora)
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/packages
      # Xvfb and D-Bus for starting the agent, FUSE for the AppImage, and
      # the WebKitGTK runtime: an AppImage expects the system's own base
      # graphics libraries (libEGL and others linuxdeploy never bundles),
      # which a desktop has and a bare runner does not. None of them pulls
      # in the tray library (checked before each start).
      - name: Test tools and a desktop's base libraries
        run: |
          # No man page index rebuilds (minutes on hosted runners).
          sudo rm -f /var/lib/man-db/auto-update
          # A download that stalls (a mirror that stops sending) fails after 30 s
          # and is retried, instead of hanging until the step's timeout.
          sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 900 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 xvfb xauth dbus libfuse2t64 libwebkit2gtk-4.1-0
      # Without the tray library on the system: the agent keeps running
      # without a tray icon (the .deb's agent, not installed), and the
      # AppImage's agent uses the library it bundles.
      - name: The agent without a tray library
        run: |
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -n 1)
          test -n "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-files"
          tools/ci/check-linux-install.sh without-tray "$RUNNER_TEMP/deb-files/usr/bin/deckpilot-agent"
      - name: The AppImage's agent on a system without the tray library
        run: |
          appimage=$(find "$RUNNER_TEMP/packages" -name '*.AppImage' | head -n 1)
          test -n "$appimage"
          tools/ci/check-linux-install.sh appimage "$appimage"
      - name: Install the .deb with its declared dependencies and start the agent
        run: |
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -n 1)
          test -n "$deb"
          timeout 1200 tools/ci/check-linux-install.sh deb "$deb"
      # Now with the system's own libayatana-appindicator3 (installed with
      # the .deb), built against Ubuntu 24.04's newer GLib.
      - name: The AppImage's agent on a system with its own tray library
        run: |
          appimage=$(find "$RUNNER_TEMP/packages" -name '*.AppImage' | head -n 1)
          tools/ci/check-linux-install.sh appimage "$appimage"
      # The udev rule's maintainer scripts (packaging/linux/postinst.sh,
      # postrm.sh): reinstalling, removing and purging the .deb installed
      # above, on this runner, where udev runs (the scripts reload and
      # trigger for real), then the whole cycle in a container without udev.
      # A user profile made first in $HOME must be untouched afterwards.
      - name: Reinstall, remove and purge the .deb (udev reload, package files, user data)
        run: |
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -n 1)
          timeout 600 tools/ci/check-linux-install.sh deb-lifecycle "$deb"
      - name: Install, reinstall, remove and purge the .deb in a container without udev
        run: |
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -n 1)
          timeout 1200 tools/ci/check-linux-install.sh deb-container "$deb"
      - name: Install, start, reinstall and remove the .rpm in Fedora (package files, user data)
        run: |
          rpm=$(find "$RUNNER_TEMP/packages" -name '*.rpm' | head -n 1)
          if [ -z "$rpm" ]; then
            echo "pre-release version: no .rpm was built"
            exit 0
          fi
          timeout 1200 tools/ci/check-linux-install.sh rpm "$rpm"

  # The client the upgrade check drives the agents with (deckpilot-dev
  # validation, tools/dev/src/validation.rs), built from this commit while
  # the packages are built.
  upgrade-tools:
    name: Upgrade tools (deckpilot-dev)
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: upgrade-tools
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Build deckpilot-dev
        run: cargo build --locked -p deckpilot-dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-tools
          path: target/debug/deckpilot-dev
          if-no-files-found: error
          retention-days: 3

  # The upgrade from the latest published release to the packages built
  # above, on a fresh Ubuntu 24.04 runner (tools/ci/check-upgrade.sh): the
  # release's .deb and AppImage are downloaded and checked (SHA256SUMS,
  # updater signatures with the pinned key, latest.json), the .deb is
  # installed with apt, its agent opens a copy of a fixture configuration
  # (schema 13, the development password) on an isolated profile and
  # changes it over IPC, then this commit's .deb is installed over it with
  # apt and its agent opens the same data: the profiles, the active profile
  # and the update mode are kept, the schema is this commit's, the upgrade
  # is recorded with a backup that opens with the same key, and the agent
  # answers at this commit's protocol. The release's agent must then refuse
  # the upgraded data and change nothing. The same with the AppImages,
  # replaced in place as the updater does. Nothing is published; no secret,
  # credential store or production service is used (the plugin registry
  # points at an unreachable loopback URL).
  upgrade-linux:
    name: Upgrade from the release (Linux .deb and AppImage)
    needs: [package-linux, upgrade-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-tools
          path: ${{ runner.temp }}/tools
      # minisign for the signatures, D-Bus for the agents' sessions, FUSE
      # and the WebKitGTK runtime for the AppImages (as install-linux).
      - name: Test tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 900 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            minisign dbus libfuse2t64 libwebkit2gtk-4.1-0
          chmod +x "$RUNNER_TEMP/tools/deckpilot-dev"
      # The read-only token for the download only: the release's packages
      # and agents run in later steps, without it.
      - name: The release, its checksums and updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat tools/release-pipeline/compat-baseline)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          tools/ci/check-upgrade.sh download "$tag" "$RUNNER_TEMP/release"
      - name: Upgrade the release's .deb to this commit's with apt
        run: |
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -n 1)
          test -n "$deb"
          timeout 900 tools/ci/check-upgrade.sh deb "$RELEASE_TAG" "$RUNNER_TEMP/release" "$deb" "$RUNNER_TEMP/tools/deckpilot-dev"
      - name: Replace the release's AppImage with this commit's
        run: |
          appimage=$(find "$RUNNER_TEMP/packages" -name '*.AppImage' | head -n 1)
          test -n "$appimage"
          timeout 900 tools/ci/check-upgrade.sh appimage "$RELEASE_TAG" "$RUNNER_TEMP/release" "$appimage" "$RUNNER_TEMP/tools/deckpilot-dev"

  # Builds the Windows installers with the release configuration, the way
  # the release workflow does (agent built in a bash step with Strawberry
  # Perl for OpenSSL), with updater signatures from a throwaway key, and
  # checks their contents. Not code-signed; nothing is published.
  package-windows:
    name: Package check (Windows installers)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install
      - name: WebAssembly target (bundled plugins)
        shell: bash
        run: rustup target add wasm32-unknown-unknown
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-windows
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Strawberry Perl for OpenSSL
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Throwaway updater key (not the release key)
        shell: bash
        run: tools/ci/throwaway-updater-key.sh
      # The plugin host and the bundled first-party plugins; exports
      # DECKPILOT_BUNDLED_PINS for the agent build.
      - name: Build and stage the plugin runtime
        shell: bash
        run: |
          tools/ci/stage-plugin-runtime.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and stage the agent (plugins, bundled pins)
        shell: bash
        run: |
          test -n "$DECKPILOT_BUNDLED_PINS"
          cargo build --release --locked -p deckpilot-agent --features plugins
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent.exe "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p').exe"
          tools/release-pipeline/check-bundled-plugins.sh target/bundled-plugins/bundled target/release/deckpilot-agent.exe
      # WiX accepts only numeric versions: a pre-release gets the MSI
      # version from the input or tools/ci/msi-version.sh.
      - name: Pre-release or final version, MSI version
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          prerelease="$PRERELEASE_INPUT"
          case "$version" in *-*) prerelease=true ;; esac
          msi="${MSI_VERSION_INPUT:-$(tools/ci/msi-version.sh "$version")}"
          [[ "$msi" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::msi-version '$msi' is not numeric (X.Y.Z or X.Y.Z.N)"; exit 1; }
          jq -n --arg v "$msi" '{bundle: {windows: {wix: {version: $v}}}}' > "$RUNNER_TEMP/msi-version.conf.json"
          { echo "PRERELEASE=$prerelease"; echo "MSI_CONFIG=$RUNNER_TEMP/msi-version.conf.json"; } >> "$GITHUB_ENV"
          echo "version $version, pre-release: $prerelease, MSI version: $msi"
      - name: Build the installers
        shell: bash
        env:
          VITE_DECKPILOT_PLUGINS: "1"
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles nsis,msi
          --config src-tauri/tauri.release.conf.json
          --config src-tauri/tauri.plugins.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
          --config "$MSI_CONFIG"
      # The NSIS installer is run silently into a directory of its own
      # (/S, /D must come last), not unpacked with 7-Zip: the bundler
      # compresses it solid with makensis's datablock optimization, which
      # stores identical files (the bundled plugins' LICENSE files) once,
      # and 7-Zip extracts such shared blocks with the wrong content. The
      # MSI is extracted administratively, as before.
      - name: Install and extract the installers
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nsis = "target/release/bundle/nsis/DeckPilot_${version}_x64-setup.exe"
          $msi = "target/release/bundle/msi/DeckPilot_${version}_x64_en-US.msi"
          foreach ($file in @($nsis, $msi)) {
            if (-not (Test-Path $file)) { Write-Error "expected $file"; exit 1 }
          }
          $process = Start-Process (Resolve-Path $nsis).Path -Wait -PassThru -ArgumentList @("/S", "/D=$env:RUNNER_TEMP\nsis")
          if ($process.ExitCode -ne 0) { Write-Error "silent NSIS installation failed: $($process.ExitCode)"; exit 1 }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$((Resolve-Path $msi).Path)`"", "/qn", "TARGETDIR=`"$env:RUNNER_TEMP\msi`"")
          if ($process.ExitCode -ne 0) { Write-Error "administrative MSI extraction failed: $($process.ExitCode)"; exit 1 }
      - name: Names, versions, app, agent, plugin runtime, distribution record and updater signatures
        shell: bash
        run: tools/ci/check-packages.sh windows "$RUNNER_TEMP"

  # Builds the macOS .app, its updater archive (.app.tar.gz) and the disk
  # image with the release configuration, for the runner's architecture
  # (the release builds both with the same layout), with updater signatures
  # from a throwaway key, and checks the layout, Info.plist, bundled agent,
  # distribution record, updater archive and disk image. Not code-signed or
  # notarized (release.yml verifies the signed bundles with
  # .github/scripts/verify-macos-app.sh); nothing is published.
  package-macos:
    name: Package check (macOS .app, disk image)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: WebAssembly target (bundled plugins)
        run: rustup target add wasm32-unknown-unknown
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-macos
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway updater key (not the release key)
        run: tools/ci/throwaway-updater-key.sh
      # The plugin host and the bundled first-party plugins; exports
      # DECKPILOT_BUNDLED_PINS for the agent build.
      - name: Build and stage the plugin runtime
        run: |
          tools/ci/stage-plugin-runtime.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and stage the agent (plugins, bundled pins)
        run: |
          test -n "$DECKPILOT_BUNDLED_PINS"
          cargo build --release --locked -p deckpilot-agent --features plugins
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p')"
          tools/release-pipeline/check-bundled-plugins.sh target/bundled-plugins/bundled target/release/deckpilot-agent
      - name: Pre-release or final version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          prerelease="$PRERELEASE_INPUT"
          case "$version" in *-*) prerelease=true ;; esac
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "version $version, pre-release: $prerelease"
      # As in the release, where the Developer ID identity signs it: here
      # ad hoc (APPLE_SIGNING_IDENTITY=-), with the hardened runtime, its
      # identifier and exactly its one entitlement. The bundler, without
      # an identity, signs nothing and copies it into Contents/MacOS as it
      # is (tauri.plugins.macos.conf.json).
      - name: Sign the plugin host ad hoc with its entitlement
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: tools/ci/sign-macos-plugin-host.sh apps/desktop/src-tauri/binaries/macos/deckpilot-plugin-host
      - name: Build the .app, its updater archive and the disk image
        env:
          VITE_DECKPILOT_PLUGINS: "1"
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles app,dmg
          --config src-tauri/tauri.release.conf.json
          --config src-tauri/tauri.plugins.conf.json
          --config src-tauri/tauri.plugins.macos.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
      - name: Names, versions, layout, plugin runtime, distribution record, disk image and updater signatures
        run: tools/ci/check-packages.sh macos
      # The packaged agent never appears in the Dock (LSUIElement), not even
      # at startup; the app does when launched (docs/background-agent.md).
      - name: Dock presence of the packaged app and agent
        run: tools/ci/check-macos-dock.sh target/release/bundle/macos/DeckPilot.app
      # The bundle as built: exactly the host's entitlement on exactly
      # Contents/MacOS/deckpilot-plugin-host, none on the app or the agent
      # (the policy verify-macos-app.sh applies to the signed release).
      - name: Entitlement policy (the built bundle)
        run: tools/ci/check-macos-entitlements.sh target/release/bundle/macos/DeckPilot.app
      # The entitlement policy verify-macos-app.sh applies to the signed
      # release (no entitlements, but exactly the plugin host's one on
      # exactly the host), on fake bundles signed ad hoc.
      - name: Entitlement policy (fake bundles)
        run: tools/ci/test-check-macos-entitlements.sh "$RUNNER_TEMP/entitlements-test"

  # One check that always reports, whatever ran: success when every package
  # job passed or was skipped (no packaging path changed), failure when one
  # failed, was cancelled or the path check failed. A check that can be
  # required (or waited for) without blocking pull requests that skip the
  # packages.
  result:
    name: Packaging result
    needs:
      [
        changes,
        package-linux,
        install-linux,
        upgrade-tools,
        upgrade-linux,
        package-windows,
        package-macos,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every package job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null \
            || { echo "::error::a package job did not pass"; exit 1; }
          echo "$RESULTS" | jq -e '.changes.result == "success"' > /dev/null \
            || { echo "::error::the changed paths were not determined"; exit 1; }
