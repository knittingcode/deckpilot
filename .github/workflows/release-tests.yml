# Tests of the release pipeline without a release: the tag gate against a
# synthetic repository and mocked GitHub API answers, the structure of
# release.yml (every job behind the gate), the separation of application
# releases from plugin packages and registry metadata, shellcheck, and the
# release commands of deckpilot-dev. No tag, release, secret or signing key is used.
# Not a required check.
name: Release pipeline tests

on:
  pull_request:
    paths:
      # Every workflow: the release separation and secret isolation checks
      # read all of them.
      - .github/workflows/**
      - .github/scripts/**
      - .github/updater.pub
      - tools/release-pipeline/**
      # The pins of the published releases, checked by check-released-pins.sh.
      - plugins/first-party/released-pins.json
      - tools/dev/src/release.rs
      - tools/dev/src/versions.rs
      - tools/dev/src/prepare.rs
      - crates/deckpilot-update/**
      # The packaging matrix release-meta.json's artifacts are checked against.
      - docs/distribution/targets.toml
      # The downstream distribution tools (dry runs) and the Flatpak draft
      # their flathub output is made from.
      - tools/distribution/**
      - packaging/flatpak/**
  # A merge queue group (gh-readonly-queue/main/...). GitHub applies no
  # paths filter to it, so the merge-group-paths job applies the
  # pull_request paths above to the group's files and the jobs report as
  # skipped when none matches. Inert until the merge queue is enabled.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true

# The same CARGO* variables as ci.yml: Swatinem/rust-cache hashes every
# CARGO* variable into its key, and with these this job's key is the one of
# main's Linux workspace cache (shared-key ci-workspace below).
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Merge queue groups only (skipped for every other event): whether the
  # group changes a path of on.pull_request.paths
  # (tools/ci/merge-group-paths.sh). The jobs below run unless this job
  # succeeded and found no such path: skipped (any other event) or failed
  # (when in doubt), they run.
  merge-group-paths:
    name: Changed paths (merge group)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: tools/ci/merge-group-paths.sh .github/workflows/release-tests.yml

  gate:
    name: Release gate
    needs: merge-group-paths
    if: ${{ !cancelled() && (needs.merge-group-paths.result != 'success' || needs.merge-group-paths.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deckpilot-dev links the device and storage crates.
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      # This workflow never runs on main, so a cache of its own was never
      # saved (key release-tests: always cold). It restores the CI Rust
      # job's Linux workspace cache instead, which main saves after every
      # merge, and saves none (the repository cache is limited to 10 GB).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-workspace
          save-if: false
      # The Tauri CLI makes the throwaway keys of the key-pair test.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: shellcheck
        run: shellcheck -x tools/release-pipeline/*.sh tools/distribution/*.sh
      # Application releases never ship plugin packages or registry
      # metadata (docs/marketplace/distribution.md): fast, so first.
      - name: Release separation (workflow check and its fixtures)
        run: tools/release-pipeline/test-release-separation.sh "$RUNNER_TEMP/release-separation"
      # Bundled first-party plugins are app components inside the
      # installers, trusted by the pins compiled into the agent: the check
      # of the staged bundle and its fixtures.
      - name: Bundled plugins (the bundle check and its fixtures)
        run: tools/release-pipeline/test-bundled-plugins.sh "$RUNNER_TEMP/bundled-plugins"
      - name: Two-stage publication (stubbed GitHub)
        run: tools/release-pipeline/test-publication.sh "$RUNNER_TEMP/release-publication"
      - name: Release commands of deckpilot-dev and the channel rules
        run: cargo test --locked -p deckpilot-dev -p deckpilot-update
      - name: Tag gate and workflow structure
        run: tools/release-pipeline/test.sh "$RUNNER_TEMP/release-pipeline"
      # verify-release-input.sh against a stubbed gh, and every channel's
      # dry-run output from a v0.6.0-alpha.3-shaped release.
      - name: Downstream distribution tools (stubbed GitHub)
        run: tools/distribution/test.sh "$RUNNER_TEMP/distribution"
      - name: The signing check's key-pair verification (throwaway keys)
        run: tools/release-pipeline/test-updater-key-pair.sh "$RUNNER_TEMP/updater-key-pair"
