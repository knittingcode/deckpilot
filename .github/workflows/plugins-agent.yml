# The agent's experimental plugin backend (feature `plugins`, which the
# release builds enable): the dependency gate, clippy with the feature, and the
# end-to-end test through the real agent, the real sandboxed plugin host
# (built from plugins/runtime, a separate workspace) and the sample plugin,
# with a local registry signed by throwaway keys made in the test.
#
# Linux, macOS and Windows run the whole lifecycle; on Windows the
# supervisor launches the host in an AppContainer. On every OS the agent
# runs a plugin only in a host that reports a full sandbox, and the test
# checks that a host reporting a partial one is refused.
#
# Not a required check. No secrets, read-only token, no environment.
name: Plugins in the agent

on:
  push:
    branches: [main]
    paths:
      - apps/agent/**
      - crates/deckpilot-ipc/**
      - crates/deckpilot-net/**
      - crates/deckpilot-plugin-*/**
      - plugins/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - tools/ci/rust-pinned-toolchain.sh
      - tools/release-pipeline/check-bundled-plugins.sh
      - tools/release-pipeline/check-released-pins.sh
      - .github/workflows/plugins-agent.yml
  pull_request:
    paths:
      - apps/agent/**
      - crates/deckpilot-ipc/**
      - crates/deckpilot-net/**
      - crates/deckpilot-plugin-*/**
      - plugins/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - tools/ci/rust-pinned-toolchain.sh
      - tools/release-pipeline/check-bundled-plugins.sh
      - tools/release-pipeline/check-released-pins.sh
      - .github/workflows/plugins-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  e2e:
    name: Plugins in the agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # rust-toolchain.toml pins the compiler; the sample plugin needs the
      # wasm32 target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            plugins/runtime -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored OpenSSL (SQLCipher) is configured with Perl. Bash steps
      # on Windows would find Git's minimal Perl, which lacks modules the
      # configure script needs; use the runner's Strawberry Perl.
      - name: Use Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) { Write-Error "Strawberry Perl not found at $perl"; exit 1 }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The default build pulls in no plugin crates
        run: cargo test -p deckpilot-agent --test plugins_feature --locked
      - name: Clippy with plugins
        run: cargo clippy -p deckpilot-agent --features plugins --all-targets --locked -- -D warnings
      # The test builds these itself when they are missing; building them
      # first keeps compile time out of the test's timeouts.
      # Diagnostic only: the kernel and the Landlock ABI it provides
      # (landlock_create_ruleset with LANDLOCK_CREATE_RULESET_VERSION). The
      # host reports `full` only with ABI 9, or ABI 8 with the seccomp
      # cover for ResolveUnix; below that `partial`, which the agent
      # refuses, so this explains a Linux failure at a glance.
      - name: Kernel and Landlock ABI (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
          python3 -c 'import ctypes; libc = ctypes.CDLL(None, use_errno=True); v = libc.syscall(444, None, 0, 1); print("landlock ABI:", v if v >= 0 else "error %d" % ctypes.get_errno())'
      - name: Build the plugin host
        working-directory: plugins/runtime
        run: cargo build --locked -p deckpilot-plugin-host --bin deckpilot-plugin-host
      - name: Build the example plugins and the SDK test guest
        working-directory: plugins/runtime
        run: cargo build --locked -p hello-weather -p hello-world -p developer-tools -p deckpilot-sdk-test-guest -p deckpilot-example-default -p deckpilot-legacy-fixture --target wasm32-unknown-unknown --profile guest
      # The official plugins the tests run are the ones a release bundles:
      # the signed release artifacts of plugins/first-party/artifacts.json,
      # downloaded once (size and sha256 checked), then verified offline
      # with the pinned publisher keys (never --keys), released-pins.json
      # and the revocations, and unpacked (apps/agent/tests/support/
      # official.rs). The registry tool is the one built from this commit.
      - name: Stage the official plugins from their release artifacts
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          cargo build --locked -p deckpilot-plugin-registry --features publish --bin deckpilot-registry
          plugins/first-party/build.sh --fetch-only --artifacts-dir "$RUNNER_TEMP/official-artifacts"
          plugins/first-party/build.sh --out "$RUNNER_TEMP/official" --artifacts-dir "$RUNNER_TEMP/official-artifacts" \
            --offline --registry-tool "target/debug/deckpilot-registry$exe" | tee "$RUNNER_TEMP/official.log"
          # Every privileged plugin is admitted by exactly the reviewed policy.
          for id in deckpilot.docker deckpilot.git deckpilot.projects deckpilot.workflows deckpilot.workspace; do
            grep -q "^build.sh: $id .* admitted by the reviewed privileged policy" "$RUNNER_TEMP/official.log" \
              || { echo "::error::$id was not admitted by the reviewed privileged policy"; exit 1; }
          done
          echo "DECKPILOT_E2E_OFFICIAL_PLUGINS=$(native "$RUNNER_TEMP/official/bundled")" >> "$GITHUB_ENV"
      - name: Plugin unit tests (incl. the registry over HTTPS)
        run: "cargo test -p deckpilot-agent --features plugins --lib --locked plugins::"
      - name: End to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_e2e --locked -- --nocapture
      # Hello World and Developer Tools packaged from their directories,
      # installed, enabled and run; GitHub answers are canned.
      - name: Example plugins end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_examples --locked -- --nocapture
      # A local TLS server with a throwaway CA only the agent under test
      # trusts; nothing reaches the network or the real registry.
      - name: End to end over HTTPS
        run: cargo test -p deckpilot-agent --features plugins --test plugins_registry_https --locked -- --nocapture
      # The test fixture bundled as an installed application ships it,
      # seeded offline, checked against its pins and run in the host.
      - name: Bundled plugins end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_bundled --locked -- --nocapture
      # A built-in module moved to its migration-class bundled plugin: the
      # agent's fixture legacy module and the fixture plugin, consent,
      # restarts mid-migration, health check, retries, drift, the user's
      # disable and uninstall, and downgrades.
      - name: Module migration end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_migration --locked -- --nocapture
      # deckpilot.github against the built-in github module on the same
      # canned GitHub answers: every action, the same results.
      - name: GitHub plugin parity end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_github --locked -- --nocapture
      # deckpilot.gitlab against the built-in gitlab module on the same
      # canned GitLab answers: every action, the same results, on
      # GitLab.com and on a self-managed GitLab the user enters and allows.
      - name: GitLab plugin parity end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_gitlab --locked -- --nocapture
      # deckpilot.jira against the built-in jira module on the same canned
      # Jira answers: every action, the same results and the same
      # requests, on Jira Cloud and on a Data Center under a path, each a
      # site the user enters and allows.
      - name: Jira plugin parity end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_jira --locked -- --nocapture
      # The GitHub cut-over (P9): an alpha.3 configuration upgraded to a
      # plugin-enabled build, the consent through IPC, a key and a workflow
      # node in the plugin with the imported token, downgrade, GitHub
      # Enterprise, disable, uninstall and decline. GitHub never answers:
      # canned for the plugin, a stand-in on 127.0.0.1 for the built-in.
      - name: GitHub cut-over end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_cutover --locked -- --nocapture
      # The GitLab and Jira cut-overs (P11): an alpha.3 configuration
      # whose module talks to a server the user entered, upgraded to a
      # plugin-enabled build; the consent to the credential, to exactly
      # that server and, separately, to a private network through IPC; a
      # key and a workflow node in the plugin; downgrade, GitLab.com,
      # servers a plugin cannot reach, disable, uninstall and decline. No
      # server ever answers: canned for the plugin, a stand-in on
      # 127.0.0.1 for the built-in.
      - name: GitLab and Jira cut-over end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_cutover_servers --locked -- --nocapture
      # deckpilot.notifications, the first default-class plugin: parity
      # with the built-in through the real agent, first launch on a fresh
      # data directory, the user's uninstall and disable across restarts
      # and upgrades, and an alpha.3 upgrade through the alias with an
      # older build on the same data.
      - name: Notifications plugin end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_notifications --locked -- --nocapture
      # Plugin API 1.9's first-party plugins through the real host
      # operations: resource handles and a recording launcher (Workspace),
      # the project context and host-published variables (Projects), and
      # the host views (Workflows, Projects).
      - name: Workspace, Projects and Workflows plugins end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_workspace --test plugins_projects --test plugins_workflows --locked -- --nocapture
      # deckpilot.git and deckpilot.docker through the real `tool.run`:
      # a fake git and a fake docker first on the agent's PATH print the
      # built-in tests' recorded output; consent, sub-grants and the
      # user-started rule for Compose changes (Unix only).
      - name: Git and Docker plugins end to end
        if: runner.os != 'Windows'
        run: cargo test -p deckpilot-agent --features plugins --test plugins_git --test plugins_docker --locked -- --nocapture
      # The bundle layout as the release builds it (and
      # DECKPILOT_RELEASE_PLUGINS=1 locally), with the test fixture: built twice from clean
      # target directories (reproducible on this platform), no released
      # version with other files, the agent compiled with the pins, and the
      # release check against both. Last, because it rebuilds the agent.
      - name: Bundle layout dry run
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          # The release set: exactly the plugins of bundled.json, with their
          # classes. The fixture builds below contain it too, and are checked
          # against an agent compiled with their pins.
          artifacts=(--artifacts-dir "$RUNNER_TEMP/official-artifacts" --offline --registry-tool "target/debug/deckpilot-registry$exe")
          plugins/first-party/build.sh --out "$RUNNER_TEMP/bundle-release" "${artifacts[@]}"
          # A released version never changes (plugins/first-party/README.md,
          # "Versions"): no plugin of the release set has the id and version
          # of one a release shipped, recorded in
          # plugins/first-party/released-pins.json for this platform, with
          # other files. check-bundled-plugins.sh below checks it again.
          tools/release-pipeline/check-released-pins.sh "$RUNNER_TEMP/bundle-release/bundled/pins.json"
          jq -c '[.plugins[] | {id, class}] | sort_by(.id)' "$RUNNER_TEMP/bundle-release/bundled/pins.json" | tr -d '\r' > "$RUNNER_TEMP/release-set.json"
          # What bundled.json lists (every entry a release artifact naming
          # its id), as the built pins must say.
          jq -e 'all(.plugins[]; .source == "artifact")' plugins/first-party/bundled.json > /dev/null
          jq -c '[.plugins[] | {id, class}] | sort_by(.id)' plugins/first-party/bundled.json | tr -d '\r' | diff - "$RUNNER_TEMP/release-set.json"
          # The committed contracts are exactly the releases' files but the
          # module (apps/agent/tests/support/official.rs checks it too).
          for dir in "$RUNNER_TEMP"/bundle-release/bundled/deckpilot.*; do
            id=$(basename "$dir")
            diff -r -x plugin.wasm "$dir" "plugins/first-party/contracts/$id"
          done
          [ "$(ls plugins/first-party/contracts | wc -l | tr -d ' ')" = "$(jq '.plugins | length' plugins/first-party/bundled.json | tr -d '\r')" ]
          for run in a b; do
            plugins/first-party/build.sh --test-fixtures --out "$RUNNER_TEMP/bundle-$run" --target-dir "$RUNNER_TEMP/first-party-$run" "${artifacts[@]}"
          done
          # bundled/ only: the artifacts' audit log next to it records times.
          diff -r "$RUNNER_TEMP/bundle-a/bundled" "$RUNNER_TEMP/bundle-b/bundled"
          DECKPILOT_BUNDLED_PINS="$RUNNER_TEMP/bundle-a/bundled/pins.json" \
            cargo build --locked -p deckpilot-agent --features plugins --bin deckpilot-agent
          tools/release-pipeline/check-bundled-plugins.sh "$RUNNER_TEMP/bundle-a/bundled" "target/debug/deckpilot-agent$exe"
      # plugins/first-party/build.sh's release-artifact path (artifacts.sh):
      # a valid two-signature artifact staged and pinned (offline cache,
      # download through a curl stand-in, fetch-only), every refusal
      # (tampered bytes, one signature, a wrong or revoked key, a downgrade,
      # a wrong id or version, a missing file, a mutable URL, the pinned
      # keys), never both, and a mixed source and artifact build. Throwaway
      # keys made in the test, through the test-only keys hook; no network.
      - name: Bundled plugins from release artifacts
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          cargo build --locked -p deckpilot-plugin-registry --features publish --bin deckpilot-registry
          plugins/first-party/test-build.sh "$RUNNER_TEMP/first-party-artifacts-test" "target/debug/deckpilot-registry$exe"
      # The release set the dry run built (pins.json and every plugin's
      # files), to compare byte for byte with a build on another machine
      # when this platform's recorded pins (released-pins.json) differ.
      - name: Upload the bundled plugins
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled-plugins-${{ matrix.os }}
          path: ${{ runner.temp }}/bundle-release/bundled
          if-no-files-found: ignore
          retention-days: 14
