[package]
name = "deckpilot-plugin-registry"
description = "Experimental: client-side verification of the signed DeckPilot plugin registry. Not used by DeckPilot yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Reused unchanged: the app updater's minisign verifier (Tauri base64 format).
deckpilot-update.workspace = true
deckpilot-plugin-manifest.workspace = true
deckpilot-plugin-package.workspace = true
base64.workspace = true
chrono.workspace = true
# Only to read the trusted comment of a signature (verification itself goes
# through deckpilot-update).
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Feature `publish` only: signing and key generation for the publishing
# tool. The verifier library never signs anything.
minisign = { version = "0.10", optional = true }
zeroize = { workspace = true, optional = true }
# Feature `publish` only: `storefront check|build` decode every storefront
# image in full (CI), and check that text is in Unicode NFC. The client
# library (the agent) only walks image headers (`media.rs`) and never
# decodes pixels.
image = { workspace = true, optional = true, features = ["png", "jpeg", "webp"] }
unicode-normalization = { version = "0.1", optional = true }
# Feature `publish` only: `storefront check` validates the author and
# owner sources against the bundled input schemas (no HTTP or file
# reference resolution).
jsonschema = { version = "0.61", default-features = false, optional = true }

[features]
# The registry publishing tool (`deckpilot-registry` binary and the
# `publish` module). Off by default, so the client library keeps its
# dependency footprint.
publish = ["dep:minisign", "dep:zeroize", "dep:image", "dep:unicode-normalization", "dep:jsonschema"]
# Lets a configured roots.json take precedence over roots embedded at build
# time (DECKPILOT_REGISTRY_ROOT_PUBKEYS) in an optimized build, as debug
# builds always do (`roots::choose`). Enabled by the agent's `test-hooks`;
# never part of a release build.
test-hooks = []
# PrivilegedGate::open_for_tests: an open privileged-kinds gate for tests.
# Enabled only through `[dev-dependencies]` (this crate's own below, the
# agent's), so never in a library, binary or release build.
test-privileged-gate = []

# build.rs checks DECKPILOT_REGISTRY_ROOT_PUBKEYS with src/roots_check.rs.
[build-dependencies]
base64.workspace = true
minisign-verify.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "deckpilot-registry"
path = "src/bin/deckpilot-registry.rs"
required-features = ["publish"]

[[test]]
name = "publish"
required-features = ["publish"]

# Builds the `registry_roots` example with roots embedded, malformed, and
# none, in the debug and release profiles (its own target directory).
[[test]]
name = "embedded_roots"
required-features = ["publish"]

# Opens a client with this build's roots (`roots::choose`) and refreshes
# a local registry site: what the embedded_roots test runs.
[[example]]
name = "registry_roots"

[dev-dependencies]
# This crate itself with the test-only open gate, for its integration tests.
deckpilot-plugin-registry = { path = ".", features = ["test-privileged-gate"] }
# Signs test documents with throwaway keys generated per test.
minisign = "0.10"
# Validates the documents the tests sign against the bundled #191 schemas.
# Without default features: no HTTP or file reference resolution.
jsonschema = { version = "0.61", default-features = false }
# Write packages with no content check (tests/privileged.rs: what the
# verifier must refuse even when it is signed).
flate2.workspace = true
tar.workspace = true
# Encodes real PNG, JPEG and WebP fixtures for tests/storefront.rs.
image = { workspace = true, features = ["png", "jpeg", "webp"] }

[lints]
workspace = true

# The first-party publisher signature and `release sign|verify`.
[[test]]
name = "publisher"
required-features = ["publish"]

# The storefront: media headers, documents, client verification, the
# `storefront build|sign|check` commands and `verify-site
# --require-storefront`.
[[test]]
name = "storefront"
required-features = ["publish"]

# The privileged-kinds gate and the reviewed privileged policy: every
# refusal and the accepted reviewed case, with throwaway keys and the gate
# opened in the test only.
[[test]]
name = "privileged"
required-features = ["publish"]
