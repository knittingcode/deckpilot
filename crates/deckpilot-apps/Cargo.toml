[package]
name = "deckpilot-apps"
description = "Installed applications, their stable identifiers, and closing running applications, for DeckPilot's System actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The Windows folder's programs by full path, as the launch plans name them.
deckpilot-core.workspace = true
# macOS bundles' Info.plist (XML or binary), read on every platform so
# that the fixtures are tested everywhere.
plist = { version = "1", default-features = false }
# Application icons, decoded, bounded and encoded again as small PNGs
# (src/icons.rs), so the app only ever receives a picture this crate made.
image = { workspace = true, features = ["png"] }
serde.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Only the test helper (src/bin): it ignores SIGTERM to play a program that
# does not quit when asked.
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["process", "std"] }

# NSRunningApplication and NSWorkspace: their bindings are safe calls.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "objc2-core-graphics", "NSBitmapImageRep", "NSGraphicsContext", "NSImage", "NSImageRep", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Only the test helper's window (src/bin).
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    # The agent's standard handles (`native_windows::keep_std_handles_from_children`).
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

# The Win32 calls (windows, closing, process identity, icons) and two AppKit
# calls (an icon as PNG) are unsafe in Rust. This crate keeps them in small,
# documented modules (`native_windows`, `native_windows_icon`,
# `native_macos_icon`) and the test helper; everything else in the
# workspace forbids unsafe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
